<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fluent 2</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font: message-box;
        font-size: 1rem;
        margin: 0;
        padding: 4px 0;
      }

      .row {
        align-items: start;
        display: grid;
        gap: 10px;
        grid-template-columns: auto 1fr;
        padding: 10px 10px;
      }

      .row + .row {
        border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }

      .row.solo {
        display: block;
      }

      .row.solo .sub {
        margin-top: 0;
      }

      input {
        margin: 2px 0 0;
      }

      label {
        display: block;
      }

      .hint {
        font-size: 0.9em;
        margin: 2px 0 0;
        opacity: 0.75;
      }

      .sub {
        display: grid;
        gap: 4px 10px;
        grid-template-columns: max-content 1fr;
        margin-top: 12px;
        max-width: 24rem;
      }

      .sub label {
        align-self: center;
      }

      .sub .hint {
        grid-column: 2;
        margin: 0 0 4px;
      }

      .sub input,
      .sub select {
        margin: 0;
        width: 100%;
      }

    </style>
  </head>

  <body>
    <div class="row solo">
      <div class="sub">
        <label for="color-scheme">Appearance</label>
        <select id="color-scheme">
          <option value="system">Follow system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <p class="hint">
          Changing this setting also changes Thunderbird's stock theme.
        </p>
      </div>
    </div>

    <div class="row">
      <input id="mica" type="checkbox" />
      <div>
        <label for="mica">Mica backdrop</label>
        <p class="hint">
          Windows only. Lets the background show through the window with a nice blur effect.
        </p>

        <div class="sub" id="mica-options" hidden>
          <label for="backdrop">Style</label>
          <select id="backdrop">
            <option value="2">Mica</option>
            <option value="3">Acrylic</option>
          </select>
          <label for="transparency">Transparency</label>
          <input id="transparency" type="range" min="10" max="100" step="10" />
        </div>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
